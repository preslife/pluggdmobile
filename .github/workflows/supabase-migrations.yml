name: Shared backend source ownership

on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-migrations.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-migrations.yml'

permissions:
  contents: read

jobs:
  backend-source-only:
    runs-on: ubuntu-latest
    steps:
      - name: Record canonical backend deployment owner
        run: |
          echo 'Shared production migrations and Edge Functions are released from preslife/PLUGGD_Build.'
          echo 'This native repository retains source history but does not apply production migrations.'
          echo 'Reconcile backend changes into the web repository before releasing a dependent native build.'
